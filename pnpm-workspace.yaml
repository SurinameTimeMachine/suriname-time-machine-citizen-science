onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
# Prevents installation of packages newer than 7 days
# to mitigate supply chain risks
# - https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 10080
overrides:
  # Minimatch 10 has an unresolved advisory; upgrade its consumers to 11.
  'minimatch@>=7 <11': ^11.0.9
  # 4.17.1 uses an API removed in minimatch 11.
  'eslint-plugin-import-x@4.17.1': 4.18.1
# Fail on pnpm ignored build scripts
# - https://pnpm.io/settings#strictdepbuilds
strictDepBuilds: true
