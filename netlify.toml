[build.environment]
  NODE_VERSION = "24.17.0"

[[redirects]]
  from = "https://surinametimemachine.org/*"
  to = "https://surinametijdmachine.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.surinametimemachine.org/*"
  to = "https://surinametijdmachine.org/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*" # you can configure the correct paths here
  [headers.values]
    access-control-allow-origin = "*" # see a list of allowed values here: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Access-Control-Allow-Origin

[[headers]]
  for = "/datasets/*.jsonld"
  [headers.values]
    Content-Type = "application/ld+json; charset=utf-8"

# Serve the current STM gazetteer (maintained in suriname-database-model) under a stable URL
[[redirects]]
  from = "/datasets/gazetteer.jsonld"
  to = "https://raw.githubusercontent.com/SurinameTimeMachine/suriname-database-model/main/data/places-gazetteer.jsonld"
  status = 200
  force = true
